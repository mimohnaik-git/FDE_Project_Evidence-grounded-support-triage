name: Offline verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: pip check
      - run: ruff check .
      - run: python -m compileall -q agents.py app.py graph.py kb.py policy.py runtime.py evaluation
      - run: python -c "import graph, kb, policy"
      - run: pytest -q
      - run: python -m evaluation.run --output evaluation/results-ci.json
