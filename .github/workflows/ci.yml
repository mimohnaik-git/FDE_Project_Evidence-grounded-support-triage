name: Offline verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      ANONYMIZED_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: pip check
      - run: ruff check .
      - run: python -m compileall -q app.py support_triage evaluation
      - run: python -c "import support_triage.agents, support_triage.graph, support_triage.kb, support_triage.policy, support_triage.runtime"
      - run: pytest -q
      - run: python -m evaluation.run --output evaluation/results/ci.json
